<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Duyệt mask nhãn X-quang</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; background: #111418; color: #eef2f6; overflow: hidden; }
    #app { height: 100vh; display: grid; grid-template-rows: 58px minmax(0, 1fr); }
    .topbar { display: flex; gap: 12px; align-items: center; padding: 8px 14px; background: #1c2229; border-bottom: 1px solid #343c45; position: relative; z-index: 5; }
    button, select, input { background: #29313a; color: #fff; border: 1px solid #46515e; border-radius: 6px; padding: 7px 10px; }
    button:hover { background: #35414d; }
    button.primary { background: #157347; border-color: #269c66; }
    button.warn { background: #8b5a00; }
    .spacer { flex: 1; }
    #caseMeta { font-size: 13px; color: #bcc7d2; max-width: 520px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    main { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 0; overflow: hidden; }
    aside { border-right: 1px solid #343c45; background: #181d23; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    .filters { padding: 10px; display: grid; gap: 8px; border-bottom: 1px solid #343c45; }
    #caseList { min-height: 0; overflow: auto; padding: 6px; }
    .case { display: flex; justify-content: space-between; gap: 8px; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 13px; }
    .case:hover, .case.active { background: #303945; }
    .case .state { color: #9daab7; }
    .case.approved .state { color: #54d98c; }
    .case.annotated .state { color: #55b7ff; }
    .workspace { min-width: 0; min-height: 0; overflow: hidden; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
    #stage { position: relative; overflow: auto; background: #080a0d; display: flex; align-items: center; justify-content: center; min-height: 0; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9daab7; pointer-events: none; }
    #canvasWrap { position: relative; line-height: 0; box-shadow: 0 0 0 1px #3b4652; }
    #baseImage { display: block; width: 100%; height: 100%; object-fit: fill; }
    canvas { position: absolute; inset: 0; max-width: none; touch-action: none; width: 100%; height: 100%; }
    #maskCanvas { opacity: .58; cursor: crosshair; }
    .toolbar { min-height: 54px; padding: 8px 14px; display: flex; gap: 12px; align-items: center; background: #1c2229; border-top: 1px solid #343c45; flex-wrap: wrap; }
    label { display: flex; gap: 7px; align-items: center; font-size: 13px; }
    #toast { color: #6ee7a8; min-width: 150px; }
    .hint { color: #9daab7; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <button id="prevBtn">← Trước</button>
      <button id="nextBtn">Sau →</button>
      <strong id="caseTitle">—</strong>
      <span id="caseMeta"></span>
      <div class="spacer"></div>
      <button id="approveBtn" class="primary">Duyệt không sửa</button>
      <button id="saveBtn" class="primary">Lưu mask</button>
    </div>
    <main>
    <aside>
      <div class="filters">
        <select id="filter">
          <option value="review">Cần review</option>
          <option value="pending">Chưa xử lý</option>
          <option value="annotated">Đã vẽ mask</option>
          <option value="approved">Đã duyệt</option>
          <option value="all">Tất cả</option>
        </select>
        <input id="search" placeholder="Tìm Case_ID">
        <span class="hint" id="counter"></span>
      </div>
      <div id="caseList"></div>
    </aside>
    <section class="workspace">
      <div id="stage">
        <div id="loading">Đang nạp danh sách ảnh…</div>
        <div id="canvasWrap" hidden>
          <img id="baseImage" alt="Ảnh X-quang">
          <canvas id="maskCanvas"></canvas>
        </div>
      </div>
      <div class="toolbar">
        <button id="brushBtn" class="primary">Cọ vẽ (B)</button>
        <button id="eraserBtn">Tẩy (E)</button>
        <label>Cỡ cọ <input id="brushSize" type="range" min="5" max="180" value="45"><span id="sizeLabel">45</span></label>
        <label>Mask <input id="opacity" type="range" min="10" max="90" value="58"></label>
        <button id="clearBtn" class="warn">Xóa mask</button>
        <button id="autoBtn">Nạp mask tự động</button>
        <span id="toast"></span>
        <span class="spacer"></span>
        <span class="hint">Vẽ đúng vùng nhãn/bảng marker. Không tô bàn tay.</span>
      </div>
    </section>
    </main>
  </div>
  <script>
    if (window.location.protocol === 'file:') {
      window.location.replace('http://127.0.0.1:8765/');
    }

    const baseImage = document.querySelector('#baseImage');
    const maskCanvas = document.querySelector('#maskCanvas');
    const maskCtx = maskCanvas.getContext('2d', {willReadFrequently: true});
    let cases = [], visible = [], current = -1, drawing = false, mode = 'brush';

    const $ = s => document.querySelector(s);
    const toast = msg => { $('#toast').textContent = msg; setTimeout(() => $('#toast').textContent = '', 2200); };
    const loadImage = src => new Promise((resolve, reject) => {
      const image = new Image(); image.onload = () => resolve(image); image.onerror = reject;
      image.src = `${src}?t=${Date.now()}`;
    });

    function applyFilter() {
      const f = $('#filter').value, q = $('#search').value.trim();
      visible = cases.filter(c => {
        const match = !q || c.case_id.includes(q);
        if (!match) return false;
        if (f === 'all') return true;
        if (f === 'review') return c.pipeline_status.includes('REVIEW') && !['approved','annotated'].includes(c.review_status);
        return c.review_status === f;
      });
      renderList();
      $('#counter').textContent = `${visible.length}/${cases.length} ca`;
    }

    function renderList() {
      $('#caseList').innerHTML = visible.map((c, i) =>
        `<div class="case ${c.review_status} ${i === current ? 'active' : ''}" data-index="${i}">
          <span>${c.case_id}</span><span class="state">${c.review_status}</span>
        </div>`).join('');
      document.querySelectorAll('.case').forEach(el => el.onclick = () => openCase(Number(el.dataset.index)));
    }

    async function drawMaskFrom(url) {
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      try {
        const mask = await loadImage(url);
        const temp = document.createElement('canvas');
        temp.width = maskCanvas.width; temp.height = maskCanvas.height;
        const t = temp.getContext('2d'); t.drawImage(mask, 0, 0);
        const pixels = t.getImageData(0, 0, temp.width, temp.height);
        for (let i = 0; i < pixels.data.length; i += 4) {
          const on = pixels.data[i] > 127;
          pixels.data[i] = 255; pixels.data[i+1] = 35; pixels.data[i+2] = 35; pixels.data[i+3] = on ? 255 : 0;
        }
        maskCtx.putImageData(pixels, 0, 0);
      } catch { /* missing mask is a valid empty state */ }
    }

    async function openCase(index) {
      if (!visible.length) return;
      current = Math.max(0, Math.min(index, visible.length - 1));
      const c = visible[current];
      $('#loading').textContent = `Đang nạp Case ${c.case_id}…`;
      $('#canvasWrap').hidden = true;
      let image;
      try {
        image = await loadImage(`/image/${c.case_id}`);
      } catch {
        $('#loading').textContent = `Không tải được ảnh Case ${c.case_id}. Hãy nhấn Ctrl+F5.`;
        return;
      }
      maskCanvas.width = image.width; maskCanvas.height = image.height;
      baseImage.src = image.src;
      const stageWidth = Math.max($('#stage').clientWidth, 500);
      const stageHeight = Math.max($('#stage').clientHeight, 500);
      const scale = Math.min(1, (stageWidth - 30) / image.width, (stageHeight - 30) / image.height);
      $('#canvasWrap').style.width = `${image.width * scale}px`; $('#canvasWrap').style.height = `${image.height * scale}px`;
      await drawMaskFrom(c.manual_mask ? `/manual-mask/${c.case_id}` : `/auto-mask/${c.case_id}`);
      $('#canvasWrap').hidden = false;
      $('#loading').textContent = '';
      $('#caseTitle').textContent = `Case ${c.case_id}`;
      $('#caseMeta').textContent = `${c.pipeline_status} · ${c.review_reason || 'không có lý do review'} · edit ${c.artifact_area_pct || 0}%`;
      renderList();
      document.querySelector('.case.active')?.scrollIntoView({block: 'nearest'});
    }

    function pointerPosition(event) {
      const rect = maskCanvas.getBoundingClientRect();
      return { x: (event.clientX - rect.left) * maskCanvas.width / rect.width,
               y: (event.clientY - rect.top) * maskCanvas.height / rect.height };
    }
    function paint(event) {
      if (!drawing) return;
      const p = pointerPosition(event), size = Number($('#brushSize').value);
      maskCtx.globalCompositeOperation = mode === 'brush' ? 'source-over' : 'destination-out';
      maskCtx.fillStyle = '#ff2323';
      maskCtx.beginPath(); maskCtx.arc(p.x, p.y, size / 2, 0, Math.PI * 2); maskCtx.fill();
    }
    maskCanvas.onpointerdown = e => { drawing = true; maskCanvas.setPointerCapture(e.pointerId); paint(e); };
    maskCanvas.onpointermove = paint;
    maskCanvas.onpointerup = () => drawing = false;
    maskCanvas.onpointercancel = () => drawing = false;

    function setMode(next) {
      mode = next;
      $('#brushBtn').classList.toggle('primary', mode === 'brush');
      $('#eraserBtn').classList.toggle('primary', mode === 'eraser');
    }
    async function saveMask() {
      if (current < 0) return;
      const c = visible[current], out = document.createElement('canvas');
      out.width = maskCanvas.width; out.height = maskCanvas.height;
      const o = out.getContext('2d'); o.fillStyle = '#000'; o.fillRect(0, 0, out.width, out.height);
      const pixels = maskCtx.getImageData(0, 0, out.width, out.height);
      const binary = o.createImageData(out.width, out.height);
      for (let i = 0; i < pixels.data.length; i += 4) {
        const v = pixels.data[i+3] > 0 ? 255 : 0;
        binary.data[i] = binary.data[i+1] = binary.data[i+2] = v; binary.data[i+3] = 255;
      }
      o.putImageData(binary, 0, 0);
      const blob = await new Promise(resolve => out.toBlob(resolve, 'image/png'));
      const response = await fetch(`/api/mask/${c.case_id}`, {method: 'POST', body: blob});
      if (!response.ok) throw new Error(await response.text());
      c.manual_mask = true; c.review_status = 'annotated'; toast(`Đã lưu ${c.case_id}.png`); applyFilter();
    }
    async function setStatus(status) {
      if (current < 0) return;
      const c = visible[current];
      await fetch(`/api/status/${c.case_id}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status})});
      c.review_status = status; toast(`${c.case_id}: ${status}`); applyFilter();
    }

    $('#prevBtn').onclick = () => openCase(current - 1);
    $('#nextBtn').onclick = () => openCase(current + 1);
    $('#saveBtn').onclick = () => saveMask().catch(e => toast(e.message));
    $('#approveBtn').onclick = () => setStatus('approved');
    $('#brushBtn').onclick = () => setMode('brush');
    $('#eraserBtn').onclick = () => setMode('eraser');
    $('#clearBtn').onclick = () => maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
    $('#autoBtn').onclick = () => current >= 0 && drawMaskFrom(`/auto-mask/${visible[current].case_id}`);
    $('#brushSize').oninput = e => $('#sizeLabel').textContent = e.target.value;
    $('#opacity').oninput = e => maskCanvas.style.opacity = e.target.value / 100;
    $('#filter').onchange = applyFilter; $('#search').oninput = applyFilter;
    window.onkeydown = e => {
      if (e.target.matches('input,select')) return;
      if (e.key.toLowerCase() === 'b') setMode('brush');
      if (e.key.toLowerCase() === 'e') setMode('eraser');
      if (e.key === 'ArrowLeft') openCase(current - 1);
      if (e.key === 'ArrowRight') openCase(current + 1);
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveMask(); }
    };

    let caseLoadAttempt = 0;
    async function loadCases() {
      try {
        const response = await fetch(`/api/cases?t=${Date.now()}`, {cache: 'no-store'});
        if (!response.ok) throw new Error(`API ${response.status}`);
        cases = await response.json();
        caseLoadAttempt = 0;
        applyFilter();
        if (visible.length) await openCase(0);
        else $('#loading').textContent = 'Không có ca nào trong bộ lọc hiện tại.';
      } catch (error) {
        caseLoadAttempt += 1;
        const delaySeconds = Math.min(5, caseLoadAttempt);
        $('#loading').textContent =
          `Máy chủ tạm thời chưa phản hồi (${error.message}). Đang thử lại sau ${delaySeconds} giây…`;
        setTimeout(loadCases, delaySeconds * 1000);
      }
    }
    loadCases();
  </script>
</body>
</html>
