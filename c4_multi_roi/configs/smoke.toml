[data]
manifest = "c4_multi_roi/outputs/pilot_v1/pilot_manifest.csv"
image_root = "."
validation_fold = 1
expected_rows = 100

[run]
run_id = "C4_MULTI_ROI_SMOKE"
output_root = "c4_multi_roi/runs"
seed = 42
device = "auto"
deterministic = true
allow_tf32 = true

[model]
view_mode = "global_plus_six"
pretrained = false
image_size = 64
sex_embedding_dim = 16
head_hidden_dim = 256
dropout = 0.2
target_mean = 127.23833273957962
target_std = 41.248974358112605
augmentation = "light"

[training]
epochs = 1
batch_size = 1
grad_accum_steps = 1
learning_rate = 0.0002
min_learning_rate = 0.000001
weight_decay = 0.05
smooth_l1_beta_months = 3.0
gradient_clip_norm = 5.0
patience = 2
min_delta_mae = 0.01
amp = false

[operations]
num_workers = 0
log_every_steps = 1
checkpoint_every_steps = 1
checkpoint_every_minutes = 999.0
